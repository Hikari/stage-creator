[project]
name = "ipsc-stage-creator"
version = "0.1.0"
description = "A Django-based web application for designing IPSC shooting stages with drag-and-drop functionality"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.16,<6.0",
    "pillow>=10.0.0",
    "python-decouple>=3.8",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-django>=4.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stages", "config"]
