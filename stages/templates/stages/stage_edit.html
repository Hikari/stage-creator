{% extends "stages/base.html" %}

{% block title %}Edit {{ stage.name }} - IPSC Stage Creator{% endblock %}

{% block content %}
<div class="card">
    <h2>Edit Stage: {{ stage.name }}</h2>
    <form method="post" action="{% url 'stage_edit' stage.pk %}">
        {% csrf_token %}

        <div class="form-group">
            <label for="name">Stage Name *</label>
            <input type="text" id="name" name="name" value="{{ stage.name }}" required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description">{{ stage.description }}</textarea>
        </div>

        <div class="form-group">
            <label for="width">Stage Width (meters) *</label>
            <input type="number" id="width" name="width" step="0.1" min="1" value="{{ stage.width }}" required>
        </div>

        <div class="form-group">
            <label for="height">Stage Height (meters) *</label>
            <input type="number" id="height" name="height" step="0.1" min="1" value="{{ stage.height }}" required>
        </div>

        <div style="display: flex; gap: 1rem;">
            <button type="submit" class="btn">Save Changes</button>
            <a href="{% url 'stage_detail' stage.pk %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
