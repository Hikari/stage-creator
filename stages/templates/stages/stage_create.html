{% extends "stages/base.html" %}

{% block title %}Create New Stage - IPSC Stage Creator{% endblock %}

{% block content %}
<div class="card">
    <h2>Create New Stage</h2>
    <form method="post" action="{% url 'stage_create' %}">
        {% csrf_token %}

        <div class="form-group">
            <label for="name">Stage Name *</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description"></textarea>
        </div>

        <div class="form-group">
            <label for="width">Stage Width (meters) *</label>
            <input type="number" id="width" name="width" step="0.1" min="1" value="10" required>
        </div>

        <div class="form-group">
            <label for="height">Stage Length (meters) *</label>
            <input type="number" id="height" name="height" step="0.1" min="1" value="10" required>
            <small style="color: #7f8c8d;">Depth of the stage (downrange direction)</small>
        </div>

        <div class="form-group">
            <label for="bullet_trap_sides">Bullet Trap Position *</label>
            <select id="bullet_trap_sides" name="bullet_trap_sides" required>
                <option value="north">North (Downrange)</option>
                <option value="south">South (Uprange)</option>
                <option value="east">East (Right Side)</option>
                <option value="west">West (Left Side)</option>
                <option value="north-east">North-East (Corner)</option>
                <option value="north-west">North-West (Corner)</option>
                <option value="south-east">South-East (Corner)</option>
                <option value="south-west">South-West (Corner)</option>
                <option value="east-west">East-West (Both Sides)</option>
            </select>
            <small style="color: #7f8c8d;">Where are the bullet traps/backstops located?</small>
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" id="is_public" name="is_public" checked>
                Make this stage public (visible to all users)
            </label>
        </div>

        <div style="display: flex; gap: 1rem;">
            <button type="submit" class="btn">Create Stage</button>
            <a href="{% url 'stage_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
