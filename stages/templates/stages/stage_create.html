{% extends "stages/base.html" %}

{% block title %}Create New Stage - IPSC Stage Creator{% endblock %}

{% block content %}
<div class="card">
    <h2>Create New Stage</h2>
    <form method="post" action="{% url 'stage_create' %}">
        {% csrf_token %}

        <div class="form-group">
            <label for="name">Stage Name *</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description"></textarea>
        </div>

        <div class="form-group">
            <label for="width">Stage Width (meters) *</label>
            <input type="number" id="width" name="width" step="0.1" min="1" value="10" required>
        </div>

        <div class="form-group">
            <label for="height">Stage Height (meters) *</label>
            <input type="number" id="height" name="height" step="0.1" min="1" value="10" required>
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" id="is_public" name="is_public" checked>
                Make this stage public (visible to all users)
            </label>
        </div>

        <div style="display: flex; gap: 1rem;">
            <button type="submit" class="btn">Create Stage</button>
            <a href="{% url 'stage_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
